      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: magnum-pc
        run: npm install --no-audit --no-fund

      - name: Build the Windows installer
        working-directory: magnum-pc
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: magnum-windows
          path: |
            magnum-pc/dist/*.exe
