          [IO.File]::WriteAllBytes("magnum-pc.zip", [Convert]::FromBase64String(($b64 -replace '\s','')))
          Expand-Archive magnum-pc.zip -DestinationPath . -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: magnum-pc
        run: npm install --no-audit --no-fund

      - name: Build the Windows installer
        working-directory: magnum-pc
        run: npm run dist

      - name: Publish as a release (direct .exe download, no zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem magnum-pc/dist/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $mb = [math]::Round($exe.Length / 1MB, 1)
          "$hash  $($exe.Name)" | Out-File -Encoding ascii magnum-pc/dist/SHA256.txt
          $notes = "File: $($exe.Name)`nSize: $mb MB ($($exe.Length) bytes)`nSHA256: $hash`n`nOn your laptop, open PowerShell in the download folder and run: Get-FileHash .\$($exe.Name)`nThe hash must match exactly. If it does not, the download was damaged: download again."
          gh release create "windows-${{ github.run_number }}" $exe.FullName magnum-pc/dist/SHA256.txt --repo "${{ github.repository }}" --title "magnum for Windows (build ${{ github.run_number }})" --notes $notes

      - uses: actions/upload-artifact@v4
        with:
          name: magnum-windows
          path: |
            magnum-pc/dist/*.exe
